   name: Playwright E2E
   on:
     push: { branches: [main] }
     pull_request:
     workflow_dispatch:
   permissions:
     contents: read
     pages: write
     id-token: write
   jobs:
     test:
       runs-on: ubuntu-latest
       outputs:
         report: ${{ steps.check.outputs.report }}
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with: { node-version: 20, cache: npm }
         - run: npm ci
         - run: npx playwright install --with-deps
         - run: npx playwright test
         - id: check
           if: always()
           run: '[ -f playwright-report/index.html ] && echo "report=true" >> "$GITHUB_OUTPUT" || true'
         - uses: actions/upload-artifact@v4
           if: always() && steps.check.outputs.report == 'true'
           with: { name: playwright-report, path: playwright-report/, retention-days: 14 }
         - uses: actions/upload-pages-artifact@v3
           if: always() && steps.check.outputs.report == 'true' && github.ref == 'refs/heads/main'
           with: { path: playwright-report/ }
     publish-report:
       needs: test
       if: ${{ !cancelled() && needs.test.outputs.report == 'true' && github.ref == 'refs/heads/main' }}
       runs-on: ubuntu-latest
       environment:
         name: github-pages
         url: ${{ steps.d.outputs.page_url }}
       steps:
         - id: d
           uses: actions/deploy-pages@v4